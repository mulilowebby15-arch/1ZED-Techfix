<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Booking Details | Admin | 1ZED TechFix</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

<header class="navbar">

    <div class="nav-container">

        <a
            href="admin-dashboard.html"
            class="logo"
        >
            1<span class="logo-zed">ZED</span>
            <span class="logo-techfix">TechFix</span>
        </a>


        <div class="nav-actions">

            <a
                href="admin-dashboard.html"
                class="btn btn-primary"
            >
                Back to Dashboard
            </a>

        </div>

    </div>

</header>


<main class="dashboard-page">

    <section class="dashboard-container">

        <!-- PAGE HEADER -->

        <div class="dashboard-welcome">

            <div>

                <span class="dashboard-badge">
                    Booking Management
                </span>

                <h1>
                    Booking Details
                </h1>

                <p>
                    View complete information about this repair booking.
                </p>

            </div>

        </div>


        <!-- BOOKING DETAILS -->

        <section class="dashboard-section">

            <div
                id="adminBookingDetails"
                class="recent-bookings"
            >

                <div class="empty-bookings">

                    <div class="empty-icon">
                        📋
                    </div>

                    <h3>
                        Loading booking...
                    </h3>

                    <p>
                        Please wait while we load the booking details.
                    </p>

                </div>

            </div>

        </section>

    </section>

</main>


<script src="../js/adminBookingDetails.js"></script>

</body>

</html>
