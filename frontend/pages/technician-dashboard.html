<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Technician Dashboard | 1ZED TechFix</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

<header class="navbar">

    <div class="nav-container">

        <a
            href="../index.html"
            class="logo"
        >
            1<span class="logo-zed">ZED</span>
            <span class="logo-techfix">TechFix</span>
        </a>


        <div class="nav-actions">

            <button
                type="button"
                id="logoutButton"
                class="btn btn-primary"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<main class="dashboard-page">

    <section class="dashboard-container">


        <!-- WELCOME -->

        <div class="dashboard-welcome">

            <div>

                <span class="dashboard-badge">
                    Technician Dashboard
                </span>

                <h1>
                    Welcome,
                    <span id="technicianName">
                        Technician
                    </span>
                    👋
                </h1>

                <p>
                    Manage your assigned repair jobs
                    and update their progress.
                </p>

            </div>

        </div>


        <!-- SUMMARY CARDS -->

        <div class="dashboard-cards">


            <div class="dashboard-card">

                <div class="dashboard-card-icon">
                    📋
                </div>

                <h2>
                    Assigned Jobs
                </h2>

                <p id="assignedJobs">
                    0
                </p>

            </div>


            <div class="dashboard-card">

                <div class="dashboard-card-icon">
                    🔧
                </div>

                <h2>
                    In Progress
                </h2>

                <p id="inProgressJobs">
                    0
                </p>

            </div>


            <div class="dashboard-card">

                <div class="dashboard-card-icon">
                    ✅
                </div>

                <h2>
                    Completed
                </h2>

                <p id="completedJobs">
                    0
                </p>

            </div>


        </div>


        <!-- ASSIGNED BOOKINGS -->

        <section class="dashboard-section">

            <div class="dashboard-section-heading">

                <div>

                    <span class="dashboard-badge">
                        Repair Management
                    </span>

                    <h2>
                        My Assigned Repairs
                    </h2>

                </div>

            </div>


            <div
                id="technicianBookings"
                class="recent-bookings"
            >

                <div class="empty-bookings">

                    <div class="empty-icon">
                        🔧
                    </div>

                    <h3>
                        Loading repairs...
                    </h3>

                    <p>
                        Please wait while we load your assigned repairs.
                    </p>

                </div>

            </div>


        </section>


    </section>

</main>


<script src="../js/technicianDashboard.js"></script>

</body>

</html>
